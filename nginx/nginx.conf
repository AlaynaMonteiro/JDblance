# Control group for the JDblance load balancer.
#
# Same backends, same traffic, so a benchmark against :8080 (nginx) and :8000
# (JDblance) is a fair comparison.  This config is tuned rather than naive -- the
# point is to beat a *good* nginx setup, not a straw man:
#
#   least_conn      the best algorithm open-source nginx offers (EWMA and P2C
#                   are commercial-only), so JDblance's p2c_ewma has real competition
#   keepalive       upstream connection reuse, matching JDblance's pooling
#   max_fails       passive ejection, nginx's analogue of a circuit breaker
#
# What nginx OSS structurally cannot do here, and JDblance does: adaptive
# concurrency limiting, CoDel-based load shedding, request hedging, retry
# budgets, and a runtime control plane for draining a backend without a reload.

worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 8192;
    multi_accept on;
}

http {
    access_log off;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;

    upstream backend_servers {
        least_conn;

        server backend1:5000 max_fails=3 fail_timeout=5s;
        server backend2:5000 max_fails=3 fail_timeout=5s;
        server backend3:5000 max_fails=3 fail_timeout=5s;
        server backend4:5000 max_fails=3 fail_timeout=5s;

        # Tailscale-connected machines join here.  Run `tailscale ip -4` on the
        # remote host and paste the 100.x address:
        # server 100.119.221.6:5001 max_fails=3 fail_timeout=5s;

        keepalive 64;
        keepalive_requests 1000;
        keepalive_timeout 30s;
    }

    server {
        listen 80 reuseport backlog=4096;

        location / {
            proxy_pass http://backend_servers;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 1s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;

            add_header X-Balancer "nginx" always;
        }

        location = /nginx_status {
            stub_status;
        }
    }
}
